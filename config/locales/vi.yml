        learn_more: "Tìm hiểu thêm"
        architecture:
          title: "Kiến Trúc & Khả Năng Mở Rộng"
          body: "Chúng tôi thiết kế monolith có thể mở rộng. Từ tối ưu hóa cơ sở dữ liệu đến xử lý nền với Sidekiq, chúng tôi đảm bảo ứng dụng Rails của bạn xử lý hàng triệu yêu cầu dễ dàng."
          item_1: "Thiết Kế Multi-tenant"
          item_2: "Redis & Caching Layers"
          image_alt: "Hạ tầng máy chủ"
        security:
          title: "Bảo Mật Toàn Diện"
          body: "Tuân thủ và an toàn được tích hợp vào từng dòng code. Chúng tôi thực hiện kiểm tra kỹ lưỡng và triển khai xác thực tốt nhất."
        performance:
          title: "Hiệu Năng"
          body: "Loại bỏ truy vấn N+1 và tối ưu hóa front-end. Chúng tôi đảm bảo ứng dụng Rails của bạn cực kỳ nhanh cho mọi người dùng."
        consulting:
          title: "Tư Vấn Kỹ Thuật"
          body: "Cần hiện đại hóa ứng dụng Rails cũ? Các chuyên gia của chúng tôi cung cấp lộ trình và thực thi để nâng cấp và tái cấu trúc liền mạch."
          image_alt: "Buổi tư vấn kỹ thuật"
      insights:
        title: "Bài Viết Kỹ Thuật Nổi Bật"
        subtitle: "Phân tích chuyên sâu về hệ sinh thái Ruby on Rails."
        view_all: "Xem tất cả bài viết"
        fallback_1:
          title: "Tìm Hiểu Warden Trong Rails"
          body: "Phân tích sâu về middleware xác thực và chiến lược bảo mật trong các ứng dụng Rails hiện đại."
        fallback_2:
          title: "Bắt Đầu Với Hotwire"
          body: "Xây dựng trải nghiệm tương tác với Turbo và Stimulus trong khi giữ kiến trúc Rails đơn giản."
      team:
        title: "Những Bộ Óc Đằng Sau Code"
        body: "Đội ngũ chúng tôi gồm các lập trình viên cấp cao, người đóng góp mã nguồn mở và chuyên gia trong ngành tận tụy với cộng đồng Rails."
        member_alt: "Thành viên nhóm"
        fallback_alt: "Kiến trúc sư trưởng"
        fallback_name: "Kiến Trúc Sư Rails"
        fallback_role: "Kỹ Sư Trưởng"
        cta: "Gia Nhập Nhóm Kỹ Thuật"
