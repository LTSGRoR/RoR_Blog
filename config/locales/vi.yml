        title: "Kỹ Thuật Xuất Sắc Với Ruby on Rails"
        body: "Chúng tôi xây dựng các ứng dụng web mạnh mẽ, có thể mở rộng và bảo mật bằng framework năng suất nhất thế giới. Bộ phận chúng tôi cam kết về sự nghiêm ngặt kỹ thuật và đóng góp cộng đồng."
